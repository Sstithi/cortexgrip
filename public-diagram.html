<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CortexGrip Public Product Diagram</title>
<link rel="icon" href="https://www.cortexgrip.com/favicon.ico" sizes="any">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
:root{--bg:#f9f8f7;--card:#fff;--muted:#f3f0ee;--border:#e8e3df;--text:#1c1917;--sub:#79706b;--primary:#f24e29}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Inter,Arial,sans-serif}.page{padding:20px;max-width:2200px;margin:auto}
header{display:flex;justify-content:space-between;gap:16px;align-items:center;padding:14px 18px;background:var(--card);border:1px solid var(--border);border-radius:12px}.brand{display:flex;align-items:center;gap:12px}.mark{width:38px;height:38px;border-radius:10px;background:#1c1917 url('/favicon.svg') center/contain no-repeat}.brand h1{font-size:18px;margin:0}.meta{font-size:12px;color:var(--sub)}
.board-wrap{overflow:auto;padding:4px 4px 84px;margin-top:18px;cursor:grab;scrollbar-color:var(--primary) var(--muted);scrollbar-width:auto}.board-wrap:active{cursor:grabbing}.board-wrap::-webkit-scrollbar{height:14px}.board-wrap::-webkit-scrollbar-track{background:var(--muted);border-radius:999px}.board-wrap::-webkit-scrollbar-thumb{background:var(--primary);border-radius:999px;border:3px solid var(--muted)}
.scroll-dock{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:20;display:flex;align-items:center;gap:6px;padding:7px;background:#1c1917eb;color:#fff;border-radius:12px;box-shadow:0 8px 28px #0004;backdrop-filter:blur(8px)}.scroll-dock button{width:38px;height:36px;border:1px solid #ffffff33;border-radius:8px;background:#ffffff12;color:#fff;font-size:18px;cursor:pointer}.scroll-dock button:hover{background:var(--primary)}.scroll-dock button:disabled{opacity:.3;cursor:default}.scroll-state{min-width:150px;text-align:center;font-size:11px}.scroll-hint{position:sticky;left:8px;width:max-content;margin:8px 0 -4px;padding:5px 9px;border-radius:999px;background:#1c1917;color:#fff;font-size:11px;z-index:3}.edge-cue{position:fixed;z-index:19;padding:7px 10px;border-radius:999px;background:var(--primary);color:#fff;font-size:12px;font-weight:700;box-shadow:0 4px 14px #0003;pointer-events:none}.edge-right{right:12px;top:50%}.edge-bottom{bottom:74px;left:50%;transform:translateX(-50%)}.edge-cue[hidden]{display:none!important}.board{display:grid;gap:18px;align-items:start}.product{text-align:center}.product-head{padding:13px 14px;border-radius:12px;background:var(--primary);color:#fff;font-size:16px;font-weight:700;box-shadow:0 2px 6px #1c191720}.line{height:24px;width:2px;background:var(--border);margin:auto}.owners{display:grid;gap:18px}.branch{display:grid;justify-items:center}.owner{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:9px 13px;min-width:180px;text-align:left}.label{display:block;color:var(--sub);font-size:11px;margin-bottom:2px}.tasks{display:grid;gap:10px;width:100%}.task{background:var(--card);border:1px solid var(--border);border-radius:12px;text-align:left;overflow:hidden}.task-head{padding:10px 12px;background:#faf8f6;border-bottom:1px solid var(--border)}.title{font-weight:650;margin-bottom:6px}.pill{display:inline-block;border-radius:999px;padding:3px 8px;font-size:11px;font-weight:600;background:var(--muted);border:1px solid var(--border)}.task-body{padding:11px 12px}.dates{display:grid;grid-template-columns:1fr 1fr;gap:8px}.box{padding:8px;border:1px solid var(--border);border-radius:8px;background:#faf8f6}.comment{border-top:1px solid var(--border);padding-top:8px;margin-top:9px}.comment-head{display:flex;align-items:center;justify-content:space-between;gap:8px}.history-btn{width:30px;height:28px;border:1px solid var(--border);border-radius:7px;background:#fff;color:var(--text);font-size:16px;line-height:1;cursor:pointer}.history-btn:hover{border-color:var(--primary);color:var(--primary)}.subs{border-top:1px dashed var(--border);padding-top:8px;margin-top:9px;font-size:11.5px;color:var(--sub)}.empty{padding:40px;text-align:center;color:var(--sub)}.modal{position:fixed;inset:0;z-index:40;display:none;place-items:center;padding:18px;background:#1c191799}.modal.open{display:grid}.modal-card{width:min(680px,100%);max-height:min(78vh,760px);overflow:auto;background:var(--card);border-radius:14px;box-shadow:0 20px 60px #0005}.modal-head{position:sticky;top:0;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px;background:var(--card);border-bottom:1px solid var(--border)}.modal-head h2{font-size:17px;margin:0}.modal-close{width:34px;height:32px;border:1px solid var(--border);border-radius:8px;background:#fff;cursor:pointer;font-size:18px}.modal-body{padding:16px}.history-current,.history-entry{padding:11px;border:1px solid var(--border);border-radius:9px;white-space:pre-wrap}.history-entry{margin-top:9px}.history-time{color:var(--sub);font-size:11px;margin-bottom:6px}.history-change{display:grid;grid-template-columns:1fr 1fr;gap:9px}.history-value{padding:8px;background:var(--muted);border-radius:7px}.history-empty{color:var(--sub);padding:14px 0}
.status-in-progress{color:#1d4ed8;background:#eff6ff}.status-complete{color:#136e37;background:#ecfdf3}.status-blocked{color:#a61b12;background:#fff1f0}.status-on-hold{color:#9a4507;background:#fff8e7}.status-planning{color:#5b21b6;background:#f5f3ff}.status-post-completion-process{color:#0e6f68;background:#effcf9}.status-blocked,.status-on-hold{color:#991b1b;background:#fee2e2;border-color:#ef4444}.status-complete{color:#166534;background:#dcfce7;border-color:#22c55e}.subs .subtask-state{padding:3px 6px;border-radius:6px}
@media(max-width:700px){.page{padding:10px}.dates{grid-template-columns:1fr}header{align-items:flex-start}.scroll-dock{bottom:8px}.scroll-state{min-width:110px}.scroll-hint{display:none}}
</style>
</head><body><main class="page"><header><div class="brand"><span class="mark"></span><div><h1>CortexGrip Product / Process Diagram</h1><div class="meta">Public read-only view</div></div></div><div style="display:flex;align-items:center;gap:8px"><select id="diagramViewMode" aria-label="Diagram status view"><option value="active">Planning + In Progress</option><option value="blocked">Blocked + On Hold</option><option value="progressComplete">In Progress + Complete</option><option value="all">Show all statuses</option></select><div id="updated" class="meta">Loading…</div></div></header><div id="boardWrap" class="board-wrap"><div id="board" class="board"><div class="empty">Loading diagram…</div></div></div></main><nav class="scroll-dock" aria-label="Diagram navigation"><button id="leftBtn" type="button" title="Scroll left">←</button><button id="rightBtn" type="button" title="Scroll right">→</button><button id="upBtn" type="button" title="Scroll up">↑</button><button id="downBtn" type="button" title="Scroll down">↓</button><span id="scrollState" class="scroll-state">Checking diagram size…</span></nav><div id="historyModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="historyTitle"><section class="modal-card"><div class="modal-head"><h2 id="historyTitle">Comment history</h2><button id="historyClose" class="modal-close" type="button" aria-label="Close">×</button></div><div id="historyBody" class="modal-body"></div></section></div>
<script>
const esc=v=>String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#39;");
const cls=v=>"status-"+String(v||"").toLowerCase().trim().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"");
let taskById=new Map(),diagramViewMode="active";
const diagramStatusVisible=status=>diagramViewMode==="blocked"?status==="Blocked"||status==="On Hold":diagramViewMode==="progressComplete"?status==="In Progress"||status==="Complete":diagramViewMode==="all"?true:status==="Planning"||status==="In Progress";
const date=v=>/^\d{4}-\d{2}-\d{2}$/.test(v||"")?new Intl.DateTimeFormat(undefined,{day:"numeric",month:"short",year:"numeric",timeZone:"UTC"}).format(new Date(v+"T00:00:00Z")):(v||"No deadline");
function render(data){
 const order=new Map((data.diagramTaskOrder||[]).map((id,i)=>[id,i])),products=data.products||[],tasks=data.tasks||[],board=document.getElementById("board");taskById=new Map(tasks.map(t=>[String(t.id),t]));
 board.style.gridTemplateColumns="repeat("+Math.max(products.length,1)+",minmax(310px,1fr))";board.style.minWidth=Math.max(310,products.length*330)+"px";
 board.innerHTML=products.length?products.map(product=>{
  const owners=[];tasks.filter(t=>t.product===product&&diagramStatusVisible(t.status)).forEach(t=>{const o=(t.owner||"").trim()||"Unassigned";if(!owners.includes(o))owners.push(o)});
  const ownerHtml=owners.map(owner=>{
   const list=tasks.filter(t=>t.product===product&&((t.owner||"").trim()||"Unassigned")===owner&&diagramStatusVisible(t.status)).sort((a,b)=>(order.get(a.id)??999999)-(order.get(b.id)??999999));
   return '<div class="branch"><div class="owner"><span class="label">Responsible</span><strong>'+esc(owner)+'</strong></div><div class="line"></div><div class="tasks">'+list.map(t=>{
    const visibleSubs=(t.subtasks||[]).filter(s=>diagramStatusVisible(s.status)),hiddenCount=(t.subtasks||[]).length-visibleSubs.length;const subs=visibleSubs.length||hiddenCount?'<div class="subs"><span class="label">Subtasks ('+visibleSubs.length+(hiddenCount&&diagramViewMode!=="all"?' shown · '+hiddenCount+' hidden':'')+')</span>'+visibleSubs.map(s=>'<div class="subtask-state '+cls(s.status)+'">• <b>'+esc(s.title||"Untitled subtask")+'</b> — '+esc(s.status)+' · Next: '+esc(date(s.nextUpdateDeadline))+' · Finish: '+esc(date(s.deadline))+' <button class="history-btn" type="button" data-history-task="'+esc(t.id)+'" data-history-sub="'+esc(s.id)+'" title="View history" aria-label="View subtask history">🕘</button></div>').join("")+'</div>':"";
    return '<article class="task"><div class="task-head"><div class="title">'+esc(t.name||"Untitled task")+'</div><span class="pill '+cls(t.status)+'">'+esc(t.status)+'</span></div><div class="task-body"><div class="dates"><div class="box"><span class="label">Next update</span>'+esc(date(t.nextUpdateDeadline))+'</div><div class="box"><span class="label">Finish deadline</span>'+esc(date(t.deadline))+'</div></div>'+(t.comment?'<div class="comment"><div class="comment-head"><span class="label">Comments</span><button class="history-btn" type="button" data-history-task="'+esc(t.id)+'" title="View history" aria-label="View task history">🕘</button></div>'+esc(t.comment).replaceAll("\n","<br>")+'</div>':'<div style="text-align:right"><button class="history-btn" type="button" data-history-task="'+esc(t.id)+'" title="View history" aria-label="View task history">🕘</button></div>')+subs+'</div></article>'
   }).join("")+'</div></div>'
  }).join("");
  return '<section class="product"><div class="product-head">'+esc(product)+'</div><div class="line"></div><div class="owners">'+ownerHtml+'</div></section>'
 }).join(""):'<div class="empty">No products are available.</div>';
 document.getElementById("updated").textContent=data.updatedAt?"Updated "+new Date(data.updatedAt).toLocaleString():"No saved data";
}
function unifiedHistory(target){
 const rows=[];
 (target.commentHistory||[]).forEach(h=>rows.push({at:h.changedAt,text:"Comment: "+(h.from||"Blank")+" → "+(h.to||"Blank")}));
 (target.dateHistory||[]).forEach(h=>rows.push({at:h.changedAt,text:(h.field==="nextUpdateDeadline"?"Next update":h.field==="deadline"?"Finish deadline":"Deadline")+": "+(h.from||"Blank")+" → "+(h.to||"Blank")+(h.comment?" · "+h.comment:"")}));
 (target.manualHistory||[]).forEach(h=>rows.push({at:h.occurredAt||h.addedAt,text:h.note||""}));
 return rows.sort((a,b)=>new Date(b.at)-new Date(a.at));
}
function openHistory(taskId,subId=""){const t=taskById.get(String(taskId));if(!t)return;const target=subId?(t.subtasks||[]).find(s=>String(s.id)===String(subId)):t;if(!target)return;const history=unifiedHistory(target);document.getElementById("historyTitle").textContent=(subId?(target.title||"Subtask"):(t.name||"Task"))+" — history";document.getElementById("historyBody").innerHTML='<div class="history-current"><span class="label">Current comment</span>'+esc(target.comment||"No comment")+'</div>'+(history.length?history.map(h=>'<div class="history-entry"><div class="history-time">'+esc(h.at?new Date(h.at).toLocaleString():"Unknown time")+'</div><div class="history-value">'+esc(h.text||"")+'</div></div>').join(""):'<div class="history-empty">No history has been recorded.</div>');document.getElementById("historyModal").classList.add("open")}
function closeHistory(){document.getElementById("historyModal").classList.remove("open")}
document.addEventListener("click",e=>{const b=e.target.closest("[data-history-task]");if(b)openHistory(b.dataset.historyTask,b.dataset.historySub||"")});document.getElementById("historyClose").onclick=closeHistory;document.getElementById("historyModal").addEventListener("click",e=>{if(e.target.id==="historyModal")closeHistory()});document.addEventListener("keydown",e=>{if(e.key==="Escape")closeHistory()});
async function load(){try{const r=await fetch("/api/public-diagram",{cache:"no-store"}),d=await r.json();if(!r.ok)throw Error(d.error||"Unable to load diagram");render(d)}catch(e){document.getElementById("board").innerHTML='<div class="empty">'+esc(e.message)+'</div>';document.getElementById("updated").textContent="Unavailable"}}
const wrap=document.getElementById("boardWrap"),state=document.getElementById("scrollState");
function navState(){
 const maxX=Math.max(0,wrap.scrollWidth-wrap.clientWidth),maxY=Math.max(0,document.documentElement.scrollHeight-innerHeight);
 const x=maxX?Math.round(wrap.scrollLeft/maxX*100):100,y=maxY?Math.round(scrollY/maxY*100):100;
 document.getElementById("leftBtn").disabled=wrap.scrollLeft<=2;document.getElementById("rightBtn").disabled=wrap.scrollLeft>=maxX-2;
 document.getElementById("upBtn").disabled=scrollY<=2;document.getElementById("downBtn").disabled=scrollY>=maxY-2;
 state.textContent=(maxX?"Across "+x+"%":"Fits width")+" · "+(maxY?"Down "+y+"%":"Fits height");
}
document.getElementById("diagramViewMode").onchange=e=>{diagramViewMode=e.target.value;load()};
document.getElementById("leftBtn").onclick=()=>wrap.scrollBy({left:-innerWidth*.72,behavior:"smooth"});
document.getElementById("rightBtn").onclick=()=>wrap.scrollBy({left:innerWidth*.72,behavior:"smooth"});
document.getElementById("upBtn").onclick=()=>scrollBy({top:-innerHeight*.72,behavior:"smooth"});
document.getElementById("downBtn").onclick=()=>scrollBy({top:innerHeight*.72,behavior:"smooth"});
let dragging=false,startX=0,startScroll=0;
wrap.addEventListener("pointerdown",e=>{if(e.target.closest("a,button"))return;dragging=true;startX=e.clientX;startScroll=wrap.scrollLeft;wrap.setPointerCapture(e.pointerId)});
wrap.addEventListener("pointermove",e=>{if(dragging)wrap.scrollLeft=startScroll-(e.clientX-startX)});
wrap.addEventListener("pointerup",()=>dragging=false);wrap.addEventListener("pointercancel",()=>dragging=false);
wrap.addEventListener("wheel",e=>{if(e.shiftKey&&Math.abs(e.deltaY)>Math.abs(e.deltaX)){e.preventDefault();wrap.scrollLeft+=e.deltaY}},{passive:false});
wrap.addEventListener("scroll",navState,{passive:true});addEventListener("scroll",navState,{passive:true});addEventListener("resize",navState);
load().then(()=>setTimeout(navState,100));setInterval(load,60000);
</script></body></html>
