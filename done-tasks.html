<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CortexGrip Done Tasks</title><link rel="icon" href="https://www.cortexgrip.com/favicon.ico" sizes="any"><style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');:root{--bg:#f9f8f7;--card:#fff;--muted:#f3f0ee;--border:#e8e3df;--text:#1c1917;--sub:#79706b;--primary:#f24e29}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Inter,Arial,sans-serif}.page{max-width:1500px;margin:auto;padding:20px}header,.toolbar,.card{background:var(--card);border:1px solid var(--border);border-radius:12px}header{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:15px 18px}.brand{display:flex;gap:12px;align-items:center}.mark{width:38px;height:38px;background:url('/favicon.svg') center/contain no-repeat}.brand h1{font-size:19px;margin:0}.sub{color:var(--sub);font-size:12px}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:14px;padding:12px}button,input{font:inherit;height:38px;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--text);padding:0 12px}button{cursor:pointer;font-weight:600}button.primary{background:var(--primary);border-color:var(--primary);color:#fff}input{flex:1;min-width:220px}.grid{display:grid;gap:12px;margin-top:14px}.card{padding:15px}.card-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.card h2{font-size:16px;margin:0}.pill{padding:3px 8px;border-radius:999px;background:#ecfdf3;color:#136e37;font-size:11px;font-weight:700}.meta{display:flex;gap:12px;flex-wrap:wrap;color:var(--sub);font-size:12px;margin-top:7px}.comment{padding:10px;margin-top:12px;background:var(--muted);border-radius:8px;white-space:pre-wrap}.history{display:grid;gap:7px;margin-top:9px}.history details{border:1px solid var(--border);border-radius:8px;padding:8px}.history summary{cursor:pointer;font-weight:600}.entry{padding:8px 0;border-top:1px solid var(--border);white-space:pre-wrap}.empty{padding:40px;text-align:center;color:var(--sub)}#gate{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:20;padding:18px}#gate .card{width:min(440px,100%)}@media(max-width:700px){.page{padding:10px}.card-head{display:block}.pill{display:inline-block;margin-top:8px}}
</style></head><body><div id="gate"><section class="card"><h2>Open completed tasks</h2><p class="sub">Enter your private CortexGrip tracker key.</p><div class="toolbar" style="border:0;padding:0"><input id="key" type="password" placeholder="Tracker key"><button id="connect" class="primary">Connect</button></div><p id="gateStatus" class="sub"></p></section></div><main class="page"><header><div class="brand"><span class="mark"></span><div><h1>Completed Tasks</h1><div id="updated" class="sub">CortexGrip private archive view</div></div></div><a href="/"><button type="button">Back to tracker</button></a></header><div class="toolbar"><input id="search" placeholder="Search completed tasks, owners, products or comments"><button id="download" class="primary">Download CSV</button><span id="count" class="sub"></span></div><section id="list" class="grid"></section></main><script>
let tasks=[],key=sessionStorage.getItem("cortexGripTrackerKey")||"";
const esc=v=>String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#39;");
const fmt=v=>v?new Date(v).toLocaleString():"Unknown time";const date=v=>/^\d{4}-\d{2}-\d{2}$/.test(v||"")?new Intl.DateTimeFormat(undefined,{day:"numeric",month:"short",year:"numeric",timeZone:"UTC"}).format(new Date(v+"T00:00:00Z")):(v||"No deadline");
function render(){
 const q=document.getElementById("search").value.toLowerCase(),filtered=tasks.filter(t=>(t.name+" "+t.owner+" "+t.product+" "+t.comment).toLowerCase().includes(q));
 document.getElementById("count").textContent=filtered.length+" completed task"+(filtered.length===1?"":"s");
 document.getElementById("list").innerHTML=filtered.length?filtered.map(t=>'<article class="card"><div class="card-head"><div><h2>'+esc(t.name||"Untitled task")+'</h2><div class="meta"><span>'+esc(t.product||"No product")+'</span><span>Responsible: '+esc(t.owner||"Unassigned")+'</span><span>Finish: '+esc(date(t.deadline))+'</span></div></div><span class="pill">'+esc(t.status||"Complete")+'</span></div><div class="comment"><b>Current comment</b><br>'+esc(t.comment||"No comment")+'</div><div class="history"><details><summary>Comment history ('+(t.commentHistory||[]).length+')</summary>'+((t.commentHistory||[]).length?(t.commentHistory||[]).map(h=>'<div class="entry"><b>'+esc(fmt(h.changedAt))+'</b><br><span class="sub">Previous</span><br>'+esc(h.from||"Blank")+'<br><span class="sub">Changed to</span><br>'+esc(h.to||"Blank")+'</div>').join(""):'<div class="entry sub">No earlier comment changes recorded.</div>')+'</details><details><summary>Date history ('+(t.dateHistory||[]).length+')</summary>'+((t.dateHistory||[]).length?(t.dateHistory||[]).map(h=>'<div class="entry"><b>'+esc(fmt(h.changedAt))+' · '+esc(h.source||"Task")+'</b><br>'+esc(h.field)+': '+esc(h.from||"Blank")+' → '+esc(h.to||"Blank")+'<br><span class="sub">Comment at the time</span><br>'+esc(h.comment||"No comment")+'</div>').join(""):'<div class="entry sub">No date changes recorded.</div>')+'</details></div></article>').join(""):'<div class="empty">No completed tasks found.</div>';
}
async function connect(){
 key=document.getElementById("key").value||key;if(!key)return;
 const status=document.getElementById("gateStatus");status.textContent="Loading…";
 try{const r=await fetch("/api/tracker",{headers:{Authorization:"Bearer "+key,Accept:"application/json"},cache:"no-store"}),d=await r.json();if(!r.ok)throw Error(d.error||"Unable to load");tasks=(d.data?.tasks||[]).filter(t=>t.done||t.status==="Complete");sessionStorage.setItem("cortexGripTrackerKey",key);document.getElementById("gate").style.display="none";document.getElementById("updated").textContent=d.updatedAt?"Tracker updated "+fmt(d.updatedAt):"CortexGrip private archive view";render()}catch(e){status.textContent=e.message}}
document.getElementById("connect").onclick=connect;document.getElementById("key").onkeydown=e=>{if(e.key==="Enter")connect()};document.getElementById("search").oninput=render;
document.getElementById("download").onclick=()=>{const headers=["Task ID","Task Name","Status","Product / Process","Responsible","Next Update Deadline","Finish Deadline","Current Comment","Comment History","Date History"],cell=v=>'"'+String(v??"").replaceAll('"','""')+'"',rows=tasks.map(t=>[t.id,t.name,t.status,t.product,t.owner,t.nextUpdateDeadline,t.deadline,t.comment,(t.commentHistory||[]).map(h=>fmt(h.changedAt)+": "+h.from+" -> "+h.to).join("\n"),(t.dateHistory||[]).map(h=>fmt(h.changedAt)+" "+h.field+": "+h.from+" -> "+h.to+" | "+(h.comment||"")).join("\n")]);const csv="\uFEFF"+[headers,...rows].map(r=>r.map(cell).join(",")).join("\r\n"),blob=new Blob([csv],{type:"text/csv;charset=utf-8"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="cortexgrip-completed-tasks.csv";a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
if(key){document.getElementById("key").value=key;connect()}
</script></body></html>
